name: Android APK

# Builds the Android app and attaches the APK to a GitHub Release.
#   Release:  git tag v1.0.0 && git push origin v1.0.0
#   Or:       Actions → Android APK → Run workflow, tick "Publish a GitHub Release"
#   Test run: Run workflow without ticking it (APK is uploaded as a build artifact)
#
# Optional signing secrets (Settings → Secrets and variables → Actions). Without them
# the workflow ships a debug-signed APK, which installs fine but can't be updated in
# place by a later release built on a different machine.
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (tag v<package.json version>) with the APK
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - name: Copy web build into the Android project
        run: npx cap sync android

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          cd android && ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Letterbook.apk"

      - name: Build debug APK (no signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          cd android && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Letterbook.apk"

      - name: Name the APK after the version
        id: name
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [ "${{ inputs.release }}" = "true" ]; then VERSION="$PKG_VERSION"
          else VERSION="$PKG_VERSION-build.$GITHUB_RUN_NUMBER"; fi
          mv Letterbook.apk "Letterbook-$VERSION.apk"
          echo "file=Letterbook-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.name.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Letterbook ${{ steps.name.outputs.version }}
          files: ${{ steps.name.outputs.file }}
          generate_release_notes: true
